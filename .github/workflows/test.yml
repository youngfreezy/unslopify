name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q
      - name: dogfood the repo docs
        # README quotes flagged phrases in its calibration section, which
        # is what --ignore-quotes exists for.
        run: |
          unslopify README.md --ignore-quotes
          unslopify SKILL.md
          unslopify examples/chat.md
          unslopify examples/draft.md
